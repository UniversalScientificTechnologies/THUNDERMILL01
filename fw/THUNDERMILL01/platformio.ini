; ============================================================
;  THUNDERMILL01
;  ATmega1284P + MightyCore
;  - externí oscilátor 16 MHz
;  - UART0 bootloader (urboot, autobaud, vector, EEPROM+CE)
;  - 2 prostředí: ISP/STK500 + UART (urclock)
; ============================================================

[platformio]
boards_dir = ../boards

[env]
platform = atmelavr
framework = arduino
board = THUNDERMILL01

; MightyCore
board_build.core = MightyCore
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_bootloader.type = urboot
board_bootloader.led_pin = B7

monitor_speed = 115200

build_flags =
  -DARDUINO_AVR_ATmega1284P

; Fuses pro ATmega1284P, 16 MHz ext. krystal, BOD 2.7V, EESAVE, urboot (vector bootloader)
; lfuse 0xF7  - full swing crystal oscillator, no CKDIV8
; hfuse 0xD3  - JTAG off, SPI on, EESAVE, BOOTSZ=01, BOOTRST=0 (reset na 0x0000 - vector BL)
; efuse 0xFD  - BOD 2.7V
; Pozn.: urboot je vector bootloader - BOOTRST bit neprogramován (0xD3 místo 0xD2)

; =========================
; 1) ISP / STK500 (programátor)
;    Nahraje bootloader + fuses
;    pio run -e THUNDERMILL01_isp -t bootloader
; =========================
[env:THUNDERMILL01_isp]
extends = env

upload_protocol = stk500v2
upload_port = /dev/ttyUSB0
upload_speed = 115200

upload_flags =
  -P$UPLOAD_PORT
  -b115200
  -B10
  -Uefuse:w:0xFD:m
  -Uhfuse:w:0xD3:m
  -Ulfuse:w:0xF7:m

; =========================
; 2) UART bootloader (urboot/urclock) UART0, autobaud
;    pio run -e THUNDERMILL01_uart -t upload
; =========================
[env:THUNDERMILL01_uart]
extends = env

upload_protocol = urclock
upload_port = /dev/ttyUSB0
upload_speed = 115200

monitor_port = /dev/ttyUSB0
monitor_speed = 115200
