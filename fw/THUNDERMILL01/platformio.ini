; ============================================================
;  THUNDERMILL01
;  ATmega1284P + MightyCore
;  - externí oscilátor 16 MHz
;  - UART0 bootloader (Optiboot BIGBOOT, 115200 baud)
;  - 2 prostředí: ISP/STK500 + UART
; ============================================================

[platformio]
boards_dir = ../boards

[env]
platform = atmelavr
framework = arduino
board = THUNDERMILL01

; MightyCore
board_build.core = MightyCore
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_bootloader.type = optiboot
board_bootloader.led_pin = B7

monitor_speed = 115200

build_flags =
  -DARDUINO_AVR_ATmega1284P

; Fuses pro ATmega1284P, 16 MHz ext. krystal, BOD 2.7V, EESAVE, Optiboot BIGBOOT 1024 words
; lfuse 0xF7  - full swing crystal oscillator, no CKDIV8
; hfuse 0xD2  - JTAG off, SPI on, EESAVE, BOOTSZ=01 (1024 words), BOOTRST
; efuse 0xFD  - BOD 2.7V

; =========================
; 1) ISP / STK500 (programátor)
;    Nahraje aplikaci + bootloader + fuses
; =========================
[env:THUNDERMILL01_isp]
extends = env

upload_protocol = stk500v2
upload_speed = 115200

upload_flags =
  -b115200
  -B10
  -cstk500v2
  -e
  -Uflash:w:${platformio.packages_dir}/framework-arduino-avr-mightycore/bootloaders/optiboot_flash/bootloaders/atmega1284p/16000000L/optiboot_flash_atmega1284p_UART0_115200_16000000L_B7_BIGBOOT.hex:i
  -Uefuse:w:0xFD:m
  -Uhfuse:w:0xD2:m
  -Ulfuse:w:0xF7:m

; =========================
; 2) UART bootloader (Optiboot) UART0, 115200 baud
; =========================
[env:THUNDERMILL01_uart]
extends = env

upload_protocol = arduino
upload_port = /dev/ttyUSB0
upload_speed = 115200

monitor_port = /dev/ttyUSB0
monitor_speed = 115200
